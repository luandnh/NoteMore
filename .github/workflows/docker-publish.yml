name: CI and Docker Publish

on:
  push:
    tags:
      - "v*.*.*"

env:
  NODE_VERSION: "24"
  DOCKER_IMAGE: luandnh1998/notemore
  PLATFORMS: linux/amd64,linux/arm64

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tag:
    name: Stage 1 - Validate Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate semver tag format (vX.Y.Z)
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected format: vX.Y.Z (example: v1.2.3)"
            exit 1
          fi
          echo "Valid semver tag detected: $TAG"

  build-and-check:
    name: Stage 2 - Build and Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate-tag
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Run generic checks
        run: npm run check --if-present

      - name: Run lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

  dependency-audit:
    name: Stage 3 - Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-check
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (fail on high/critical)
        run: npm audit --audit-level=high

  docker-image-verify:
    name: Stage 4 - Docker Build Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: dependency-audit
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local verification image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: local/notemore:${{ github.sha }}

  publish-docker:
    name: Stage 5 - Publish Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: docker-image-verify
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and Push Multi-Platform Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            BUILDKIT_INLINE_CACHE=1